[project]
name = "sprint-bench"
version = "0.1.0"
description = "Benchmark harness for the sprint skill. Judge is performed by Claude Code subagents, not via API."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "deepdiff>=6.7",
]

[tool.setuptools]
py-modules = ["runner", "compare", "judge"]
